<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pouch · 学习看板</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand"><a href="/">Pouch</a></div>
    <nav>
      <a href="/" class="active">首页</a>
      <a href="/list.html">列表</a>
      <a href="/detail.html">详情</a>
      <a href="/wishlist.html">心愿单</a>
      <a href="/settings.html">设置</a>
    </nav>
    <button type="button" class="theme-toggle" aria-label="切换主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
<a href="https://github.com/MPCBexplorer/Pouch" target="_blank" rel="noopener noreferrer" class="repo-link" aria-label="GitHub 仓库">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.04.59 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.6.84-2.11-.11-.25-.45-1.04.09-2.14 0 0 .69-.21 2.25.83.64-.18 1.32-.27 2-.27 .68 0 1.36.09 2 .27 1.5-.99 2.43-.83 2.43-.83.44 1.17.19 1.89.09 2.14 .53 .49 .83 1.24 .84 2.12 .0 2.04-1.82 2.82-3.65 3.94 .58 .28 1.11 .78 1.11 1.49 0 1.1-.01 1.96-.01 2.2 0 .21 .15 .45 .55 .38C13.71 14.53 16 11.53 16 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>Pouch</span>
    </a>
  </header>

  <!-- 版本更新提示 -->
  <div id="updateBanner" class="update-banner hidden">
    <div class="update-banner-content">
      <span class="update-title">发现新版本</span>
      <span id="updateVersionText" class="update-version"></span>
      <button type="button" class="btn btn-primary" id="updateGoBtn">前往下载</button>
      <button type="button" class="btn btn-ghost" id="updateCloseBtn">关闭</button>
    </div>
  </div>

  <main class="page">
    <h1>学习看板</h1>
    <div class="dashboard">

      <!-- 区块 A：四类别总量 -->
      <section class="dashboard-stats span-2 card" id="statCards" aria-label="记录总量"></section>

      <!-- 区块 B：待办完成率 -->
      <section class="card completion-ring" id="completionCard" aria-label="待办完成情况">
        <h2 class="card-title">完成情况</h2>
        <div class="chart-wrap"><canvas id="completionChart"></canvas></div>
        <div id="completionMeta" class="chart-meta"></div>
      </section>

      <!-- 区块 C：心愿单汇总 -->
      <section class="card wish-summary-card" id="wishCard" aria-label="心愿单汇总">
        <h2 class="card-title">收支心愿单</h2>
        <div id="wishSummary" class="wish-summary"></div>
        <a class="btn btn-ghost wish-all-link" href="/wishlist.html">查看全部 →</a>
      </section>

      <!-- 区块 D：随机回顾（灵感 / 知识点 上下排列，各自独立已看队列） -->
      <section class="card random-recall" id="recallCard" aria-label="随机回顾">
          <div class="recall-wrap" id="recallWrap" role="list" aria-label="随机回顾">
            <div class="recall-section" data-type="knowledge">
              <div class="recall-header">
                <h2 class="card-title">随机知识点</h2>
                <div class="recall-title-actions">
                  <button type="button" class="btn btn-ghost recall-refresh" data-type="knowledge">换一条</button>
                  <span class="recall-pool" data-type="knowledge">共 0 条知识点</span>
                </div>
              </div>
              <div class="recall-body" id="recallBodyKnowledge" role="listitem" aria-live="polite"></div>
            </div>
            <div class="recall-section" data-type="inspiration">
              <div class="recall-header">
                <h2 class="card-title">随机灵感</h2>
                <div class="recall-title-actions">
                  <button type="button" class="btn btn-ghost recall-refresh" data-type="inspiration">换一条</button>
                  <span class="recall-pool" data-type="inspiration">共 0 条灵感</span>
                </div>
              </div>
              <div class="recall-body" id="recallBodyInspiration" role="listitem" aria-live="polite"></div>
            </div>
          </div>
      </section>

      <!-- 区块 E：碎片知识构成环（只按标签；←/→ 沿标签层级调整粒度） -->
      <section class="card compose-ring" id="composeCard" aria-label="碎片知识构成">
        <h2 class="card-title">碎片知识构成</h2>
        <div class="compose-wrap" id="composeRing"></div>
        <div class="compose-nav">
          <span class="compose-path" id="composePath">全部标签</span>
          <div class="compose-arrows">
            <button type="button" class="btn btn-ghost" id="ringUp" aria-label="上一级：更概览的标签" disabled>←</button>
            <button type="button" class="btn btn-ghost" id="ringDown" aria-label="下一级：更详细的标签" disabled>→</button>
          </div>
        </div>
      </section>

      <!-- 区块 F：陈旧提醒 -->
      <section class="card stale-list span-2" id="staleCard" aria-label="陈旧提醒">
        <h2 class="card-title">陈旧提醒</h2>
        <div id="staleBody"></div>
      </section>

    </div>
  </main>

  <!-- 第三方库：本地引用，运行时不访问 CDN（ADR-001/006） -->
  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <!-- KaTeX：LaTeX 数学公式渲染（外部库，本地引用） -->
  <link rel="stylesheet" href="/vendor/katex.min.css">
  <script defer src="/vendor/katex.min.js"></script>
  <script src="/vendor/latex.js"></script>
  <script type="module" src="/js/index.js"></script>

    <div class="footer-content">
      <span>© 2026 Pouch</span>

        Pouch
      </a>
    </div>
  </footer>
</body>
</html>
