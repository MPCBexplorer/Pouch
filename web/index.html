<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pouch · 学习看板</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand"><a href="/">Pouch</a></div>
    <nav>
      <a href="/" class="active">首页</a>
      <a href="/list.html">列表</a>
      <a href="/detail.html">详情</a>
      <a href="/wishlist.html">心愿单</a>
      <a href="/settings.html">设置</a>
    </nav>
    <button type="button" class="theme-toggle" aria-label="切换主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </header>

  <!-- /api/health 的 warnings（docs/04 §4.8.6） -->
  <div id="warnBanner"></div>

  <main class="page">
    <h1>学习看板</h1>
    <div class="dashboard">

      <!-- 区块 A：四类别总量 -->
      <section class="dashboard-stats span-2 card" id="statCards" aria-label="记录总量"></section>

      <!-- 区块 B：待办完成率 -->
      <section class="card completion-ring" id="completionCard" aria-label="待办完成情况">
        <h2 class="card-title">完成情况</h2>
        <div class="chart-wrap"><canvas id="completionChart"></canvas></div>
        <div id="completionMeta" class="chart-meta"></div>
      </section>

      <!-- 区块 C：心愿单汇总 -->
      <section class="card wish-summary-card" id="wishCard" aria-label="心愿单汇总">
        <h2 class="card-title">收支心愿单</h2>
        <div id="wishSummary" class="wish-summary"></div>
        <a class="btn btn-ghost wish-all-link" href="/wishlist.html">查看全部 →</a>
      </section>

      <!-- 区块 D：随机回顾（灵感 / 知识点 双 tab，各自独立已看队列） -->
      <section class="card random-recall" id="recallCard" aria-label="随机回顾">
        <div class="recall-tabs" role="tablist" aria-label="随机回顾维度">
          <button type="button" class="recall-tab is-active" role="tab" id="tab-inspiration"
                  aria-selected="true" aria-controls="recallBody" data-type="inspiration">随机灵感</button>
          <button type="button" class="recall-tab" role="tab" id="tab-knowledge"
                  aria-selected="false" aria-controls="recallBody" data-type="knowledge">随机知识点</button>
        </div>
        <div class="recall-body" id="recallBody" role="tabpanel" aria-live="polite"></div>
      </section>

      <!-- 区块 E：碎片知识构成环（只按标签；←/→ 沿标签层级调整粒度） -->
      <section class="card compose-ring" id="composeCard" aria-label="碎片知识构成">
        <h2 class="card-title">碎片知识构成</h2>
        <div class="compose-wrap" id="composeRing"></div>
        <div class="compose-nav">
          <span class="compose-path" id="composePath">全部标签</span>
          <div class="compose-arrows">
            <button type="button" class="btn btn-ghost" id="ringUp" aria-label="上一级：更概览的标签" disabled>←</button>
            <button type="button" class="btn btn-ghost" id="ringDown" aria-label="下一级：更详细的标签" disabled>→</button>
          </div>
        </div>
      </section>

      <!-- 区块 F：陈旧提醒 -->
      <section class="card stale-list span-2" id="staleCard" aria-label="陈旧提醒">
        <h2 class="card-title">陈旧提醒</h2>
        <div id="staleBody"></div>
      </section>

    </div>
  </main>

  <!-- 第三方库：本地引用，运行时不访问 CDN（ADR-001/006） -->
  <script src="/vendor/chart.umd.min.js"></script>
  <script type="module" src="/js/index.js"></script>
</body>
</html>
