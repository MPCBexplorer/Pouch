<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pouch · 列表</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand"><a href="/">Pouch</a></div>
    <nav>
      <a href="/">首页</a>
      <a href="/list.html" class="active">列表</a>
      <a href="/detail.html">详情</a>
      <a href="/wishlist.html">心愿单</a>
      <a href="/settings.html">设置</a>
    </nav>
    <button type="button" class="theme-toggle" aria-label="切换主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </header>

  <main class="page list-page">
    <div class="list-layout">
      <!-- 左侧导航 -->
      <aside class="list-sidebar" aria-label="类别导航">
        <nav class="cat-nav" id="catNav" role="list"></nav>
        <div class="sidebar-divider"></div>
        <nav class="cat-nav" id="extraNav" role="list"></nav>
      </aside>

      <!-- 右侧内容区 -->
      <div class="list-content">
        <!-- 类别标题 -->
        <header class="list-header">
          <h1 id="listTitle">列表</h1>
        </header>

        <!-- 筛选栏 -->
        <section class="card list-filterbar" aria-label="筛选条件">
          <div class="filter-row" id="filterBar"></div>
          <div class="filter-chips" id="filterChips" hidden></div>
        </section>

        <!-- 列表视图 -->
        <section class="card list-view" aria-label="记录列表">
          <div id="listError" class="error-card" hidden></div>
          <div class="list-body" id="listBody" role="list"></div>
          <div class="list-pager" id="listPager" hidden></div>
        </section>
      </div>
    </div>

    <!-- 新建记录模态框 -->
    <dialog class="modal" id="newRecordModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <form class="modal-content" id="newRecordForm" novalidate>
        <header class="modal-header">
          <h2 id="modalTitle">新建记录</h2>
          <button type="button" class="modal-close" aria-label="关闭">&times;</button>
        </header>
        <div class="modal-body" id="modalBody"></div>
        <footer class="modal-footer">
          <button type="button" class="btn btn-ghost modal-cancel">取消</button>
          <button type="submit" class="btn btn-primary" id="modalSubmit">创建</button>
        </footer>
      </form>
    </dialog>

    <!-- 背景遮罩（用于模态框外点击关闭） -->
    <div class="modal-backdrop" id="modalBackdrop" hidden></div>
  </main>

    <script type="module" src="/js/list.js"></script>

  <footer class="site-footer">
    <div class="footer-content">
      <span>© 2026 Pouch</span>
      <a href="https://github.com/MPCBexplorer/Pouch" target="_blank" rel="noopener noreferrer" class="footer-link">
        Pouch
      </a>
    </div>
  </footer>
</body>
</html>
