<a href="https://github.com/MPCBexplorer/Pouch" target="_blank" rel="noopener noreferrer" class="repo-link" aria-label="GitHub 仓库">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.04.59 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.6.84-2.11-.11-.25-.45-1.04.09-2.14 0 0 .69-.21 2.25.83.64-.18 1.32-.27 2-.27 .68 0 1.36.09 2 .27 1.5-.99 2.43-.83 2.43-.83.44 1.17.19 1.89.09 2.14.53.49.83 1.24.84 2.12 .0 2.04-1.82 2.82-3.65 3.94 .58 .28 1.11 .78 1.11 1.49 0 1.1-.01 1.96-.01 2.2 0 .21 .15 .45 .55 .38C13.71 14.53 16 11.53 16 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>Pouch</span>
    </a>
  </header>

  <main class="page">
    <h1>心愿单</h1>

    <!-- 三项汇总 + 进度条 -->
    <section class="card wishlist-summary" aria-label="心愿单汇总">
      <div class="summary-grid">
        <div class="summary-item">
          <span class="summary-label">总心愿</span>
          <span class="summary-value" id="totalWish">¥0.00</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">已花费</span>
          <span class="summary-value" id="spent">¥0.00</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">还差</span>
          <span class="summary-value" id="remaining">¥0.00</span>
        </div>
      </div>
      <!-- 两条进度条：按数量（已购/条目数）+ 按金额（已花/总心愿，原有） -->
      <div class="progress-wrap" id="progressCountWrap" hidden>
        <span class="progress-label">数量</span>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressCountFill" style="width: 0%"></div>
        </div>
        <span class="progress-text" id="progressCountText">0%</span>
      </div>
      <div class="progress-wrap" id="progressAmountWrap" hidden>
        <span class="progress-label">金额</span>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressAmountFill" style="width: 0%"></div>
        </div>
        <span class="progress-text" id="progressAmountText">0%</span>
      </div>
    </section>

    <!-- 快速新增表单 -->
    <section class="card wishlist-quickadd" aria-label="快速新增">
      <form id="quickAddForm" novalidate>
        <div class="form-row">
          <div class="form-field">
            <label for="wishName">名称</label>
            <input type="text" id="wishName" name="name" placeholder="" required maxlength="120" autocomplete="off">
          </div>
          <div class="form-field">
            <label for="wishAmount">金额（元）</label>
            <input type="text" id="wishAmount" name="amount" placeholder="" required maxlength="20" autocomplete="off" inputmode="decimal">
          </div>
          <div class="form-field">
            <label for="wishNote">备注</label>
            <input type="text" id="wishNote" name="note" placeholder="" maxlength="500" autocomplete="off">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="quickAddBtn">添加</button>
      </form>
    </section>

    <!-- 条目列表 -->
    <section class="card wishlist-list" aria-label="心愿条目列表">
      <div id="wishlistError" class="error-card" hidden></div>
      <ul class="wishlist-items" id="wishlistItems" role="list"></ul>
      <p class="empty-state" id="emptyState" hidden>还没有心愿，去添加一条吧</p>
    </section>
  </main>

  <!-- 共享模块 -->
  <!-- 页面脚本 -->
    <script type="module" src="/js/wishlist.js"></script>

</html>
