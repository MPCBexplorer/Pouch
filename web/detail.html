<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pouch · 详情</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand"><a href="/">Pouch</a></div>
    <nav>
      <a href="/">首页</a>
      <a href="/list.html">列表</a>
      <a href="/detail.html" class="active">详情</a>
      <a href="/wishlist.html">心愿单</a>
      <a href="/settings.html">设置</a>
    </nav>
    <button type="button" class="theme-toggle" aria-label="切换主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

    </button>
  </header>

  <main class="page detail-page">
    <div class="detail-toolbar">
      <button type="button" class="btn btn-ghost" id="backBtn">← 返回</button>
      <div class="detail-toolbar-actions" id="toolbarActions"></div>
    </div>

    <div id="detailError" class="error-card" hidden></div>

    <article class="detail-card card" id="detailCard">
      <header class="detail-header" id="detailHeader"></header>
      <div id="detailGuide" hidden></div>
      <section class="detail-content" id="detailContent" aria-label="正文"></section>
      <section class="detail-tags" id="detailTags" aria-label="标签"></section>
      <section class="detail-notes" id="detailNotes" aria-label="笔记"></section>
      <footer class="detail-footer" id="detailFooter"></footer>
    </article>
  </main>

  <!-- 第三方库：本地引用，运行时不访问 CDN（ADR-001/006） -->
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script type="module" src="/js/detail.js"></script>

</html>
